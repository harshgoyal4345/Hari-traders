<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Hari Traders | Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#1a5c3a;--green2:#2d8a58;--cream:#fdf8f0;--warm:#f5efe0;--ink:#1a1208;--muted:#7a6f5e;--border:#e8dcc8;--card:#ffffff;--red:#dc2626}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px;-webkit-tap-highlight-color:transparent}
    .header{background:var(--green);padding:0 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;height:58px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#fff}.logo span{color:#f59e0b}
    .profile-trigger{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
    .hero-banner{background:var(--green);padding:14px 16px 44px}
    .hero-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .hero-text{flex:1;color:#fff}
    .hero-eyebrow{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;font-size:10px;font-weight:700;padding:3px 10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;color:rgba(255,255,255,.85)}
    .hero-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;line-height:1.2;margin-bottom:4px}
    .hero-subtitle{font-size:12px;opacity:.7}
    .hero-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;text-align:center;flex-shrink:0}
    .hero-badge-num{font-size:22px;font-weight:900;color:#f59e0b;line-height:1}
    .hero-badge-lbl{font-size:10px;color:rgba(255,255,255,.7);font-weight:600;margin-top:2px}
    .hero-wave{height:32px;background:var(--cream);clip-path:ellipse(55% 100% at 50% 100%);margin-top:-1px}
    .sticky-controls{background:var(--card);position:sticky;top:58px;z-index:999;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .search-box{margin:10px 12px 8px;background:var(--warm);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);transition:border-color .15s}
    .search-box:focus-within{border-color:var(--green)}
    .search-box input{background:transparent;border:none;outline:none;flex:1;font-size:15px;font-family:inherit;color:var(--ink)}
    .search-box input::placeholder{color:var(--muted)}
    .filter-btn{background:var(--warm);border:1.5px solid var(--border);border-radius:10px;padding:0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:36px;height:36px;flex-shrink:0;color:var(--muted)}
    .filter-btn.active{background:var(--green);border-color:var(--green);color:#fff}
    .controls-row{display:flex;align-items:center;padding:0 12px 10px;gap:8px}
    .category-scroll{display:flex;overflow-x:auto;gap:6px;flex:1}
    .category-scroll::-webkit-scrollbar{display:none}
    .cat-pill{padding:6px 16px;background:var(--warm);border:1.5px solid var(--border);border-radius:50px;white-space:nowrap;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0}
    .cat-pill.active{background:var(--green);color:#fff;border-color:var(--green)}
    .view-toggle{display:flex;background:var(--warm);border:1.5px solid var(--border);border-radius:10px;padding:2px;gap:2px;flex-shrink:0}
    .view-btn{width:32px;height:32px;border:none;background:transparent;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
    .view-btn.active{background:var(--green);color:#fff}
    #productList{padding:8px 0}
    .brand-section{background:var(--card);margin:10px 12px;border-radius:20px;padding:16px 14px;box-shadow:0 4px 20px rgba(26,18,8,.08);border:1px solid var(--border);overflow:hidden}
    .brand-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--green),var(--green2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .brand-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--ink);flex:1}
    .brand-count{font-size:11px;font-weight:700;color:var(--muted);background:var(--warm);border:1px solid var(--border);padding:3px 10px;border-radius:20px}
    .variant-grid{display:flex;overflow-x:auto;gap:12px;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .variant-grid::-webkit-scrollbar{display:none}
    .variant-grid.list-view{flex-direction:column;overflow-x:visible;gap:8px}
    .v-card{min-width:130px;max-width:130px;border-radius:16px;background:var(--warm);border:1.5px solid var(--border);overflow:hidden;position:relative;scroll-snap-align:start;flex-shrink:0}
    .v-card:active{transform:scale(.97)}
    .v-card.unavailable{opacity:.6}
    .v-card.unavailable .v-img-wrap img{filter:grayscale(60%)}
    .v-img-wrap{width:100%;height:180px;background:#fff;overflow:hidden;position:relative}
    .v-img-wrap img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:transform .2s}
    .v-card:hover .v-img-wrap img{transform:scale(1.04)}
    .v-body{padding:8px 9px 10px}
    .v-cat-tag{display:inline-block;background:rgba(26,92,58,.1);color:var(--green);border-radius:50px;font-size:9px;font-weight:800;padding:2px 7px;margin-bottom:4px;text-transform:uppercase}
    .v-label{font-size:12px;font-weight:700;line-height:1.3;height:30px;overflow:hidden;color:var(--ink);margin-bottom:3px}
    .v-price{font-family:'Playfair Display',serif;color:var(--green);font-weight:700;font-size:15px;margin-bottom:4px}
    /* STOCK PILL on card */
    .v-stock{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:6px}
    .v-stock.ok{background:#dcfce7;color:#166534}
    .v-stock.low{background:#fef3c7;color:#92400e}
    .v-stock.out{background:#fee2e2;color:var(--red)}
    .v-stock.unl{background:var(--warm);color:var(--muted);border:1px solid var(--border)}
    .unavailable-badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;z-index:10}
    .pickup-badge{position:absolute;top:8px;left:8px;background:#f59e0b;color:#fff;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;z-index:10}
    .qty-btns{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;border:1.5px solid var(--border);overflow:hidden}
    .qty-btns button{width:30px;height:30px;border:none;background:transparent;font-weight:800;font-size:18px;cursor:pointer;color:var(--green);line-height:1}
    .qty-btns button:active{background:var(--warm)}
    .qty-btns button:disabled{opacity:.3;cursor:not-allowed}
    .qty-btns span{flex:1;text-align:center;font-weight:800;font-size:14px;color:var(--ink)}
    .variant-grid.list-view .v-card{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;border-radius:14px;padding:10px;background:var(--warm)}
    .variant-grid.list-view .v-img-wrap{width:68px;height:68px;min-width:68px;border-radius:10px;flex-shrink:0}
    .variant-grid.list-view .v-body{padding:0;flex:1;min-width:0}
    .variant-grid.list-view .v-label{height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .variant-grid.list-view .v-price{margin-bottom:0}
    .variant-grid.list-view .v-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .variant-grid.list-view .qty-btns{min-width:88px}
    .cart-fab{position:fixed;bottom:20px;left:12px;right:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;padding:14px 18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 8px 24px rgba(26,92,58,.4);z-index:1001;cursor:pointer;border:none}
    .cart-fab:active{transform:scale(.98)}
    .cart-fab-left{display:flex;align-items:center;gap:10px}
    .cart-fab-icon{font-size:20px}
    .cart-fab-label{font-size:13px;opacity:.85}
    .cart-fab-count{font-size:18px;font-weight:900}
    .cart-fab-total{font-size:18px;font-weight:900;color:#f59e0b}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:flex-end;justify-content:center}
    .modal[style*="block"]{display:flex!important}
    .modal-content{background:var(--card);border-radius:24px 24px 0 0;padding:6px 20px 32px;max-height:88vh;overflow-y:auto;width:100%}
    .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px}
    .modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:16px;color:var(--ink)}
    .filter-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000}
    .filter-modal{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:24px 24px 0 0;padding:20px;z-index:2001;animation:slideUp .25s cubic-bezier(.32,.72,0,1)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .filter-option{padding:15px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;border-radius:10px;color:var(--ink)}
    .filter-option:last-child{border-bottom:none}
    .filter-option:active{background:var(--warm)}
    .filter-option.selected{color:var(--green);font-weight:700}
    .filter-option.selected::after{content:"✓";font-size:18px;color:var(--green)}
    .input-group{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;font-family:inherit;font-size:15px;outline:none;background:var(--warm);color:var(--ink)}
    .input-group:focus{border-color:var(--green)}
    .btn-action{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer;font-family:inherit}
    .btn-action:active{transform:scale(.98)}
    .btn-primary{background:var(--green);color:#fff}
    .btn-secondary{background:var(--warm);color:var(--muted);border:1.5px solid var(--border)}
    .btn-logout{width:100%;padding:14px;border:1.5px solid #fca5a5;border-radius:14px;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer;background:#fff1f2;color:var(--red);font-family:inherit}
    .address-box{border:1.5px solid var(--border);padding:13px 14px;border-radius:14px;margin-bottom:8px;cursor:pointer;font-size:14px;background:var(--warm)}
    .address-box.selected{border-color:var(--green);background:rgba(26,92,58,.06)}
    .cart-item{border-bottom:1px solid var(--border);padding:12px 0}
    .cart-item:last-child{border-bottom:none}
    .cart-item-name{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;margin-bottom:8px;color:var(--ink)}
    .cart-item-details{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
    .cart-qty-btns{display:flex;align-items:center;background:var(--warm);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin:0 8px}
    .cart-qty-btns button{width:28px;height:28px;border:none;background:transparent;font-weight:800;font-size:16px;cursor:pointer;color:var(--green);line-height:1}
    .cart-qty-btns button:disabled{opacity:.3;cursor:not-allowed}
    .cart-qty-btns span{min-width:24px;text-align:center;font-weight:800;font-size:14px}
    .mov-warning{background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:12px;font-size:13px;margin:10px 0;text-align:center;font-weight:600;border:1px solid #fde68a}
    .whatsapp-btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer;background:#25D366;color:white;text-align:center;font-family:inherit}
    .whatsapp-btn:active{opacity:.85}
    .order-history-item{border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--warm)}
    .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .order-date{font-size:12px;color:var(--muted);font-weight:700}
    .order-total{font-size:16px;font-weight:800;color:var(--green)}
    .order-items{font-size:13px;color:var(--muted);line-height:1.7}
    #imgLightbox{display:none;position:fixed;inset:0;background:rgba(10,10,10,.95);z-index:9999;flex-direction:column;align-items:center;justify-content:space-between;touch-action:none}
    #imgLightbox.active{display:flex}
    .lb-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,.4);backdrop-filter:blur(10px)}
    .lb-close{color:rgba(255,255,255,.7);font-size:24px;cursor:pointer;padding:4px 8px;background:rgba(255,255,255,.1);border-radius:8px;border:none}
    .lb-title{color:white;font-size:14px;font-weight:700;flex:1;text-align:center;padding:0 8px}
    .lb-price{color:#4ade80;font-size:16px;font-weight:800}
    .lb-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden}
    .lb-img-wrap img{max-width:88%;max-height:100%;object-fit:contain;border-radius:16px;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 40px rgba(0,0,0,.5)}
    .lb-dots{display:flex;gap:6px;justify-content:center;padding:8px 0 4px}
    .lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s}
    .lb-dot.active{background:#fff;width:18px;border-radius:3px}
    .lb-footer{width:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);padding:12px 16px 24px}
    .lb-cart-summary{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.12)}
    .lb-cart-empty{text-align:center;color:rgba(255,255,255,.3);font-size:13px;padding:2px 0}
    .lb-cart-total{display:flex;justify-content:space-between;align-items:center;color:white;font-size:15px;font-weight:800}
    .lb-cart-total-amount{color:#4ade80;font-size:18px}
    .lb-item-count-badge{background:#4ade80;color:#1a1208;font-size:10px;font-weight:800;padding:2px 8px;border-radius:50px;margin-left:6px}
    .lb-variant-info{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-bottom:8px}
    .lb-qty-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:8px}
    .lb-qty-btn{width:48px;height:48px;border:none;border-radius:50%;background:var(--green);color:white;font-size:24px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(26,92,58,.5)}
    .lb-qty-btn:active{transform:scale(.92)}.lb-qty-btn:disabled{opacity:.35;cursor:not-allowed}
    .lb-qty-num{color:white;font-size:32px;font-weight:900;min-width:44px;text-align:center}
    .lb-swipe-hint{color:rgba(255,255,255,.3);font-size:11px;text-align:center}
    .empty-state{text-align:center;padding:56px 24px;color:var(--muted)}
    .empty-state .emoji{font-size:48px;margin-bottom:12px}
  </style>
</head>
<body>

<div class="header">
  <div class="logo" id="storeLogo">Hari <span>Traders</span></div>
  <button class="profile-trigger" id="userBtn" onclick="openProfile()">Login</button>
</div>

<div class="hero-banner">
  <div class="hero-inner">
    <div class="hero-text">
      <div class="hero-eyebrow">✦ Fresh Stock Daily</div>
      <div class="hero-title">Quality Products<br>Best Prices</div>
      <div class="hero-subtitle">Namkeen · Fryums · Biscuits & More</div>
    </div>
    <div class="hero-badge">
      <div class="hero-badge-num" id="heroBadgeNum">0</div>
      <div class="hero-badge-lbl">Products</div>
    </div>
  </div>
</div>
<div class="hero-wave"></div>

<div class="sticky-controls">
  <div class="search-box">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="#7a6f5e" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="#7a6f5e" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" placeholder="Search products…" oninput="renderProducts()">
    <button class="filter-btn" id="filterBtn" onclick="openFilterModal()">⚙</button>
  </div>
  <div class="controls-row">
    <div class="category-scroll" id="catScroll"></div>
    <div class="view-toggle">
      <button class="view-btn active" id="gridBtn" onclick="setView('grid')">⊞</button>
      <button class="view-btn" id="listBtn" onclick="setView('list')">☰</button>
    </div>
  </div>
</div>

<div id="productList"></div>

<button class="cart-fab" id="cartFab" style="display:none" onclick="openCart()">
  <div class="cart-fab-left">
    <span class="cart-fab-icon">🛒</span>
    <div><div class="cart-fab-label">View Cart</div><div class="cart-fab-count" id="cartCount">0 items</div></div>
  </div>
  <div class="cart-fab-total" id="cartTotal">₹0</div>
</button>

<!-- CART MODAL -->
<div id="cartModal" class="modal" onclick="closeModals()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Order Summary</div>
    <div id="cartList"></div>
    <div id="cartGrandTotal" style="margin:16px 0;"></div>
    <button class="whatsapp-btn" onclick="prepareOrder()">✅ Confirm Order on WhatsApp</button>
    <button class="btn-action btn-secondary" onclick="closeModals()" style="margin-top:8px;">Back to Shop</button>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal" onclick="closeModals()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">My Profile</div>
    <div id="profileBody"></div>
  </div>
</div>

<!-- ORDER HISTORY MODAL -->
<div id="orderHistoryModal" class="modal" onclick="closeModals()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Order History</div>
    <div id="orderHistoryList"></div>
    <button class="btn-action btn-secondary" onclick="closeModals()">Close</button>
  </div>
</div>

<!-- IMAGE LIGHTBOX -->
<div id="imgLightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-price" id="lbPrice"></span>
  </div>
  <div class="lb-img-wrap" id="lbImgWrap"><img id="lbImg" src="" alt=""></div>
  <div class="lb-dots" id="lbDots"></div>
  <div class="lb-footer">
    <div class="lb-cart-summary" id="lbCartSummary"></div>
    <div class="lb-variant-info" id="lbVariantInfo"></div>
    <div class="lb-qty-row">
      <button class="lb-qty-btn" id="lbMinus" onclick="lbChangeQty(-1)">−</button>
      <span class="lb-qty-num" id="lbQty">0</span>
      <button class="lb-qty-btn" id="lbPlus" onclick="lbChangeQty(1)">+</button>
    </div>
    <div class="lb-swipe-hint">← swipe left/right: variant &nbsp;·&nbsp; up/down: product</div>
  </div>
</div>

<!-- FILTER SHEET -->
<div id="storeToast" style="position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#1a1208;color:#fff;padding:8px 16px;border-radius:50px;font-size:12px;font-weight:700;z-index:9500;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none"></div>
<div id="filterOverlay" class="filter-overlay" onclick="closeFilterModal()"></div>
<div id="filterModal" class="filter-modal">
  <div class="modal-handle"></div>
  <div class="modal-title" style="font-size:17px;">Filter Products</div>
  <div class="filter-option selected" data-filter="all" onclick="selectFilter('all')">🛍️ All Items</div>
  <div class="filter-option" data-filter="available" onclick="selectFilter('available')">✅ In Stock Only</div>
  <div class="filter-option" data-filter="unavailable" onclick="selectFilter('unavailable')">❌ Out of Stock</div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// DEFAULT DATA (mirror of admin defaults)
// ════════════════════════════════════════════════════════════
const DP=[

function initStore(){
  const sp=localStorage.getItem('ht_products'),ss=localStorage.getItem('ht_settings');
  products=sp?JSON.parse(sp):DP;
  settings=ss?JSON.parse(ss):DS_DEF;
  stockMap=JSON.parse(localStorage.getItem('ht_stock')||'{}');
  // Apply stock to availability
  products.forEach(p=>p.variants.forEach(v=>{
    const k=`${p.id}_${v.vid}`,s=stockMap[k];
    if(s!==undefined) v.available=(s!==0);
  }));
  const sn=settings.storeName||'Hari Traders';
  const parts=sn.split(' ');
  const last=parts.pop();
  document.getElementById('storeLogo').innerHTML=parts.join(' ')+' <span>'+last+'</span>';
  let total=0;
  products.forEach(p=>{if(p.active!==false)p.variants.forEach(v=>{if(v.active!==false)total++;});});
  document.getElementById('heroBadgeNum').textContent=total;
  if(userData.name)document.getElementById('userBtn').innerText=userData.name;
}

const WHATSAPP=()=>settings.whatsapp||'917415768041';
const MOV=()=>settings.minOrderValue||500;
const GTP=()=>settings.globalTierPricing||{enabled:false,tiers:[]};

function getMaxQty(pid,vid){
  const k=`${pid}_${vid}`,s=stockMap[k];
  return(s===undefined||s===-1)?999:s;
}
function getStockDisplay(pid,vid){
  const k=`${pid}_${vid}`,s=stockMap[k];
  if(s===undefined||s===-1)return{cls:'unl',txt:'In Stock'};
  if(s===0)return{cls:'out',txt:'Out of Stock'};
  const p=products.find(x=>x.id===pid);
  const v=p&&p.variants.find(x=>x.vid===vid);
  const lsa=(v&&v.lowStockAlert)||5;
  if(s<=lsa)return{cls:'low',txt:`Only ${s} left`};
  return{cls:'ok',txt:`${s} available`};
}

// TIER PRICING
// ════════════════════════════════════════════════════════════
function calcTierPrice(product,variant,quantity){
  const base=variant.price;
  if(!product.tierPricing||!product.tierPricing.enabled)return base;
  const tc=product.tierPricing;let fp=base;
  if(tc.brandTiers){
    let bq=0;for(let k in cart){const[pid]=k.split('_').map(Number);if(pid===product.id)bq+=cart[k];}
    let tier=tc.brandTiers[0];tc.brandTiers.forEach(t=>{if(bq>=t.minQty)tier=t;});
    if(tier.price!==undefined)fp=tier.price;else if(tier.discount)fp=Math.round(fp*(1-tier.discount/100));
  }
  if(tc.variantTiers){
    let tier=tc.variantTiers[0];tc.variantTiers.forEach(t=>{if(quantity>=t.minQty)tier=t;});
    if(tier.price!==undefined)fp=tier.price;else if(tier.discount)fp=Math.round(fp*(1-tier.discount/100));
  }
  return fp;
}
function getTPI(product,variant,quantity){
  if(!product.tierPricing||!product.tierPricing.enabled)return{price:variant.price,hasTier:false};
  const tp=calcTierPrice(product,variant,quantity);
  return{price:tp,hasTier:tp!==variant.price,originalPrice:variant.price};
}

function resolveImg(img){
  if(!img)return '';return img;
}

function renderProducts(){
  const query=document.getElementById('searchInput').value.toLowerCase();
  let h='';
  products.forEach(p=>{
    if(p.active===false)return;
    let vs=p.variants.filter(v=>{
      if(v.active===false)return false;
      if(selectedCat!=='All'&&v.category!==selectedCat)return false;
      if(!(!query||v.label.toLowerCase().includes(query)||p.name.toLowerCase().includes(query)))return false;
      if(currentFilter==='available'&&v.available===false)return false;
      if(currentFilter==='unavailable'&&v.available!==false)return false;
      return true;
    });
    vs.sort((a,b)=>{const aA=a.available!==false,bA=b.available!==false;if(aA&&!bA)return -1;if(!aA&&bA)return 1;return 0;});
    if(!vs.length)return;
    const gc=viewMode==='list'?'variant-grid list-view':'variant-grid';
    h+=`<div class="brand-section"><div class="brand-header"><div class="brand-icon">${p.icon||'🏷️'}</div><div class="brand-name">${p.name}</div><div class="brand-count">${vs.length} items</div></div><div class="${gc}">`;
    vs.forEach(v=>{
      const key=`${p.id}_${v.vid}`;
      const avail=v.available!==false,pickup=v.pickupOnly===true;
      const maxQ=getMaxQty(p.id,v.vid);
      const qty=cart[key]||0;
      const dis=!avail?'disabled':qty>=maxQ?'disabled':'';
      const pi=getTPI(p,v,qty);
      const priceHtml=pi.hasTier?`<s style="font-size:10px;color:var(--muted);font-family:'DM Sans'">₹${v.price}</s> ₹${pi.price}`:`₹${v.price}`;
      const sd=getStockDisplay(p.id,v.vid);
      const cardCls=avail?'v-card':'v-card unavailable';
      const showTag=selectedCat==='All'&&v.category;
      const catTag=showTag?`<div class="v-cat-tag">${v.category}</div>`:'';
      if(viewMode==='list'){
        h+=`<div class="${cardCls}">
          <div class="v-img-wrap" style="width:68px;height:68px;min-width:68px;border-radius:10px;flex-shrink:0"><img src="${resolveImg(v.image)}" onclick="openLightbox(${p.id},${v.vid})" style="cursor:pointer"></div>
          <div class="v-body">${catTag}<div class="v-label" style="height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.label}</div><div class="v-price">${priceHtml}</div></div>
          <div class="v-right">
            <span class="v-stock ${sd.cls}">${sd.txt}</span>
            ${pickup?'<span style="font-size:9px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:6px;font-weight:800">Pickup Only</span>':''}
            <div class="qty-btns" style="min-width:88px">
              <button onclick="updateQty(${p.id},${v.vid},-1)" >−</button>
              <span id="q_${key}">${qty}</span>
              <button onclick="updateQty(${p.id},${v.vid},1)" ${dis}>+</button>
            </div>
          </div>
        </div>`;
      } else {
        h+=`<div class="${cardCls}">
          ${!avail?'<div class="unavailable-badge">Out of Stock</div>':''}
          ${pickup?'<div class="pickup-badge">Pickup Only</div>':''}
          <div class="v-img-wrap"><img src="${resolveImg(v.image)}" onclick="openLightbox(${p.id},${v.vid})" style="cursor:pointer"></div>
          <div class="v-body">${catTag}
            <div class="v-label">${v.label}</div>
            <div class="v-price">${priceHtml}</div>
            <span class="v-stock ${sd.cls}">${sd.txt}</span>
            <div class="qty-btns">
              <button onclick="updateQty(${p.id},${v.vid},-1)" >−</button>
              <span id="q_${key}">${qty}</span>
              <button onclick="updateQty(${p.id},${v.vid},1)" ${dis}>+</button>
            </div>
          </div>
        </div>`;
      }
    });
    h+='</div></div>';
  });
  document.getElementById('productList').innerHTML=h||'<div class="empty-state"><div class="emoji">🔍</div><p>No items found.<br>Try a different search or category.</p></div>';
}

// CART
// ════════════════════════════════════════════════════════════
function updateQty(pid,vid,delta){
  const key=`${pid}_${vid}`;
  const maxQ=getMaxQty(pid,vid);
  const cur=cart[key]||0;
  const newQ=Math.max(0,cur+delta);
  if(delta>0&&newQ>maxQ){toast(`Only ${maxQ} units available.`);return;}
  cart[key]=newQ;
  if(cart[key]===0)delete cart[key];
  const el=document.getElementById('q_'+key);
  if(el)el.textContent=cart[key]||0;
  // Update minus button disabled state dynamically
  const btns=document.querySelectorAll(`button[onclick="updateQty(${pid},${vid},-1)"]`);
  btns.forEach(b=>{b.disabled=(cart[key]||0)===0;});
  // Update plus button disabled state
  const plusBtns=document.querySelectorAll(`button[onclick="updateQty(${pid},${vid},1)"]`);
  const p=products.find(x=>x.id===pid),v=p&&p.variants.find(x=>x.vid===vid);
  const avail=v&&v.available!==false;
  const newQty=cart[key]||0;
  plusBtns.forEach(b=>{b.disabled=!avail||(newQty>=maxQ&&maxQ!==99999);});
  updateCartFab();
}

function updateCartFab(){
  let total=0,items=0;
  Object.keys(cart).forEach(k=>{
    const[pid,vid]=k.split('_').map(Number);
    const p=products.find(x=>x.id===pid),v=p.variants.find(x=>x.vid===vid),q=cart[k];
    total+=q*getTPI(p,v,q).price;items+=q;
  });
  const gtp=GTP();
  if(gtp.enabled){let tier=gtp.tiers[0];gtp.tiers.forEach(t=>{if(total>=t.minTotal)tier=t;});if(tier.discount>0)total-=Math.round(total*tier.discount/100);}
  const fab=document.getElementById('cartFab');
  if(!items){fab.style.display='none';return;}
  fab.style.display='flex';
  document.getElementById('cartCount').textContent=items+' item'+(items>1?'s':'');
  document.getElementById('cartTotal').textContent='₹'+total;
}

function openCart(){
  // Group by brand (Image-2 style)
  const grouped={},brandOrder=[];
  Object.keys(cart).forEach(k=>{
    const[pid,vid]=k.split('_').map(Number);
    const p=products.find(x=>x.id===pid),v=p.variants.find(x=>x.vid===vid),q=cart[k];
    if(!grouped[pid]){grouped[pid]={p,items:[]};brandOrder.push(pid);}
    grouped[pid].items.push({v,q,k,pid,vid});
  });
  let h='',grandTotal=0,totalItems=0;
  brandOrder.forEach(pid=>{
    const grp=grouped[pid];
    h+=`<div style="font-family:'Playfair Display',serif;font-size:16px;font-weight:900;margin:12px 0 8px;color:var(--ink)">${grp.p.name}</div>`;
    grp.items.forEach(({v,q,k,pid,vid})=>{
      const pi=getTPI(grp.p,v,q);const lt=q*pi.price;
      grandTotal+=lt;totalItems+=q;
      const maxQ=getMaxQty(pid,vid);
      const sd=getStockDisplay(pid,vid);
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.label}${v.category?' · '+v.category:''} · ₹${pi.price}</div>
        </div>
        <div class="cart-qty-btns" style="flex-shrink:0">
          <button onclick="cartUpdQty(${pid},${vid},-1)">−</button>
          <span>${q}</span>
          <button onclick="cartUpdQty(${pid},${vid},1)" ${q>=maxQ?'disabled':''}>+</button>
        </div>
        <div style="font-weight:800;font-size:14px;min-width:38px;text-align:right">₹${lt}</div>
      </div>`;
    });
  });
  const gtp=GTP();let disc=0;
  if(gtp.enabled){let tier=gtp.tiers[0];gtp.tiers.forEach(t=>{if(grandTotal>=t.minTotal)tier=t;});if(tier.discount>0)disc=Math.round(grandTotal*tier.discount/100);}
  const finalTotal=grandTotal-disc;
  let th=`<div style="height:1px;background:var(--border);margin:8px 0 14px"></div>`;
  th+=`<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px"><span>Delivery Items:</span><span>₹${grandTotal}</span></div>`;
  if(disc>0)th+=`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--green);margin-bottom:6px"><span>🎉 Discount:</span><span>−₹${disc}</span></div>`;
  const mov=MOV();
  if(finalTotal>0&&finalTotal<mov)th+=`<div class="mov-warning">⚠️ Minimum delivery order: ₹${mov}</div>`;
  th+=`<div style="display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-top:8px"><span>Total:</span><span style="color:var(--green)">₹${finalTotal}</span></div>`;
  document.getElementById('cartList').innerHTML=h;
  document.getElementById('cartGrandTotal').innerHTML=th;
  document.getElementById('cartModal').style.display='block';
}
function cartUpdQty(pid,vid,d){updateQty(pid,vid,d);openCart();}

function prepareOrder(){
  const mov=MOV();let total=0,items=0;
  let msg=`🛒 *New Order — ${settings.storeName||'Hari Traders'}*\n\n`;
  const orderItems=[];
  Object.keys(cart).forEach(k=>{
    const[pid,vid]=k.split('_').map(Number);
    const p=products.find(x=>x.id===pid),v=p.variants.find(x=>x.vid===vid),q=cart[k];
    const pi=getTPI(p,v,q);const lt=q*pi.price;
    total+=lt;items+=q;
    msg+=`• ${p.name} — ${v.label} × ${q} = ₹${lt}\n`;
    orderItems.push({pid,vid,pn:p.name,vl:v.label,q,pr:pi.price,lt});
  });
  const gtp=GTP();let disc=0;
  if(gtp.enabled){let tier=gtp.tiers[0];gtp.tiers.forEach(t=>{if(total>=t.minTotal)tier=t;});if(tier.discount>0){disc=Math.round(total*tier.discount/100);msg+=`\n🎉 Discount: −₹${disc}`;total-=disc;}}
  msg+=`\n💰 *Total: ₹${total}*`;
  if(userData.name)msg+=`\n👤 ${userData.name}`;
  if(userData.addresses.length>0)msg+=`\n📍 ${userData.addresses[userData.selectedAddrIndex]}`;
  if(total<mov){alert(`Minimum order is ₹${mov}`);return;}
  // SAVE ORDER to localStorage so admin sees it
  const ordersArr=JSON.parse(localStorage.getItem('ht_orders')||'[]');
  ordersArr.push({
    id:'O'+Date.now(),ts:Date.now(),status:'new',
    customer:userData.name||'Anonymous',
    address:userData.addresses[userData.selectedAddrIndex]||'',
    items:orderItems,total,disc
  });
  localStorage.setItem('ht_orders',JSON.stringify(ordersArr));
  // Push to Supabase so admin sees it live
  pushOrderToSupabase(ordersArr[ordersArr.length-1]);
  // Save to order history
  userData.orderHistory=userData.orderHistory||[];
  userData.orderHistory.unshift({
    date:new Date().toLocaleString('en-IN'),total,
    items:Object.keys(cart).map(k=>{const[pid,vid]=k.split('_').map(Number);const p=products.find(x=>x.id===pid),v=p.variants.find(x=>x.vid===vid);return`${p.name} — ${v.label} × ${cart[k]}`;}).join('\n')
  });
  localStorage.setItem('ht_user',JSON.stringify(userData));
  window.open(`https://wa.me/${WHATSAPP()}?text=${encodeURIComponent(msg)}`,'_blank');
  cart={};updateCartFab();closeModals();
}

function openProfile(){
  let h='';
  if(!userData.name){h=`<p style="margin-bottom:12px;color:var(--muted);font-size:14px">Enter name to save orders</p><input class="input-group" id="userName" placeholder="Your name"/><button class="btn-action btn-primary" onclick="saveName()">Save</button>`;}
  else{h=`<p style="font-size:15px;margin-bottom:16px">👋 Hello, <b>${userData.name}</b></p>
    <div style="font-weight:700;font-size:13px;margin-bottom:8px;color:var(--muted)">ADDRESSES</div>
    ${(userData.addresses||[]).map((a,i)=>`<div class="address-box${i===userData.selectedAddrIndex?' selected':''}" onclick="selectAddress(${i})">${i===userData.selectedAddrIndex?'✅ ':''}${a}</div>`).join('')}

    <button class="btn-logout" onclick="confirmLogout()">🚪 Logout</button>`;}
  document.getElementById('profileBody').innerHTML=h;
  document.getElementById('profileModal').style.display='block';
}
function confirmLogout(){if(confirm('Logout?')){userData={name:'',addresses:[],selectedAddrIndex:0,orderHistory:[]};localStorage.removeItem('ht_user');document.getElementById('userBtn').innerText='Login';cart={};updateCartFab();closeModals();}}
function saveName(){const n=document.getElementById('userName').value.trim();if(n){userData.name=n;localStorage.setItem('ht_user',JSON.stringify(userData));document.getElementById('userBtn').innerText=n;openProfile();}}
function addAddress(){const a=document.getElementById('newAddress').value.trim();if(a){userData.addresses.push(a);localStorage.setItem('ht_user',JSON.stringify(userData));openProfile();}}
function selectAddress(i){userData.selectedAddrIndex=i;localStorage.setItem('ht_user',JSON.stringify(userData));openProfile();}
function viewOrderHistory(){closeModals();const oh=userData.orderHistory||[];let h=oh.length===0?'<div style="text-align:center;padding:40px;color:var(--muted)">📦 No orders yet</div>':'';oh.forEach(o=>{h+=`<div class="order-history-item"><div class="order-header"><div class="order-date">${o.date}</div><div class="order-total">₹${o.total}</div></div><div class="order-items">${o.items.replace(/\n/g,'<br>')}</div></div>`;});document.getElementById('orderHistoryList').innerHTML=h;document.getElementById('orderHistoryModal').style.display='block';}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}
function openFilterModal(){document.getElementById('filterOverlay').style.display='block';document.getElementById('filterModal').style.display='block';}
function closeFilterModal(){document.getElementById('filterOverlay').style.display='none';document.getElementById('filterModal').style.display='none';}
function selectFilter(f){currentFilter=f;document.querySelectorAll('.filter-option').forEach(o=>o.classList.remove('selected'));document.querySelector(`[data-filter="${f}"]`).classList.add('selected');document.getElementById('filterBtn').classList.toggle('active',f!=='all');renderProducts();closeFilterModal();}

// LIGHTBOX (swipe L/R=variant, U/D=product, stock enforced)
// ════════════════════════════════════════════════════════════
let lbPid=null,lbVid=null,lbVariants=[],lbVIdx=0,lbPIdx=0,lbProds=[];
let lbTX=0,lbTY=0;

function openLightbox(pid,vid){
  lbProds=[];
  products.forEach(p=>{if(p.active===false)return;const vs=p.variants.filter(v=>v.active!==false);if(vs.length>0)lbProds.push({p,vs});});
  lbPIdx=lbProds.findIndex(x=>x.p.id===pid);if(lbPIdx<0)lbPIdx=0;
  lbVariants=lbProds[lbPIdx].vs;
  lbVIdx=lbVariants.findIndex(v=>v.vid===vid);if(lbVIdx<0)lbVIdx=0;
  lbPid=pid;lbVid=vid;lbRender();
  document.getElementById('imgLightbox').classList.add('active');document.body.style.overflow='hidden';
  const w=document.getElementById('lbImgWrap');
  w.ontouchstart=e=>{lbTX=e.changedTouches[0].clientX;lbTY=e.changedTouches[0].clientY;};
  w.ontouchend=e=>{
    const dx=e.changedTouches[0].clientX-lbTX,dy=e.changedTouches[0].clientY-lbTY,mn=40;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>mn){lbVIdx=dx<0?(lbVIdx+1)%lbVariants.length:(lbVIdx-1+lbVariants.length)%lbVariants.length;lbRender();}
    else if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>mn){lbPIdx=dy<0?(lbPIdx+1)%lbProds.length:(lbPIdx-1+lbProds.length)%lbProds.length;lbVIdx=0;lbRender();}
  };
}
function lbRender(){
  const pObj=lbProds[lbPIdx];const p=pObj.p;lbVariants=pObj.vs;const v=lbVariants[lbVIdx];
  lbPid=p.id;lbVid=v.vid;
  document.getElementById('lbTitle').textContent=p.name+' · '+v.label;
  document.getElementById('lbPrice').textContent='₹'+v.price;
  const img=document.getElementById('lbImg');img.style.opacity='0';img.src=resolveImg(v.image);img.onload=()=>img.style.opacity='1';img.onerror=()=>img.style.opacity='1';
  let dots='';lbVariants.forEach((_,i)=>{dots+=`<div class="lb-dot${i===lbVIdx?' active':''}"></div>`;});
  document.getElementById('lbDots').innerHTML=dots;
  const key=`${lbPid}_${lbVid}`,qty=cart[key]||0;
  const maxQ=getMaxQty(lbPid,lbVid);
  const sd=getStockDisplay(lbPid,lbVid);
  document.getElementById('lbQty').textContent=qty;
  document.getElementById('lbMinus').disabled=!v.available||qty===0;
  document.getElementById('lbPlus').disabled=!v.available||qty>=maxQ;
  document.getElementById('lbVariantInfo').textContent=`${sd.txt} · Var ${lbVIdx+1}/${lbVariants.length} · Prod ${lbPIdx+1}/${lbProds.length}`;
  let gt=0,ti=0;
  Object.keys(cart).forEach(k=>{const[cp,cv]=k.split('_').map(Number);const pp=products.find(x=>x.id===cp),vv=pp.variants.find(x=>x.vid===cv),qq=cart[k];gt+=qq*getTPI(pp,vv,qq).price;ti+=qq;});
  const gtp=GTP();if(gtp.enabled){let tier=gtp.tiers[0];gtp.tiers.forEach(t=>{if(gt>=t.minTotal)tier=t;});if(tier.discount>0)gt-=Math.round(gt*tier.discount/100);}
  document.getElementById('lbCartSummary').innerHTML=ti===0?'<div class="lb-cart-empty">🛒 Cart is empty</div>':`<div class="lb-cart-total"><span>🛒 Cart <span class="lb-item-count-badge">${ti}</span></span><span class="lb-cart-total-amount">₹${gt}</span></div>`;
}
function closeLightbox(){document.getElementById('imgLightbox').classList.remove('active');document.body.style.overflow='';}
function lbChangeQty(delta){
  const v=lbVariants[lbVIdx];if(!v.available)return;
  const key=`${lbPid}_${lbVid}`;
  const maxQ=getMaxQty(lbPid,lbVid);
  const cur=cart[key]||0;
  if(delta>0&&cur>=maxQ){return;}
  cart[key]=Math.max(0,cur+delta);
  if(cart[key]===0)delete cart[key];
  const el=document.getElementById('q_'+key);if(el)el.textContent=cart[key]||0;
  updateCartFab();lbRender();
}

async function loadFromSupabase(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/store_data?id=eq.main&select=data',{headers:sbH()});
    if(r.ok){
      const rows=await r.json();
      if(rows&&rows.length){
        const d=rows[0].data||{};
        if(d.products){
          products=d.products;
          localStorage.setItem('ht_products',JSON.stringify(products));
          const sm=d.stock||{};
          products.forEach(function(p){
            p.variants.forEach(function(v){
              const s=sm[p.id+'_'+v.vid];
              if(s!==undefined)v.available=(s!==0);
            });
          });
        }
        if(d.settings){settings=d.settings;localStorage.setItem('ht_settings',JSON.stringify(settings));}
        if(d.stock){stockMap=d.stock;localStorage.setItem('ht_stock',JSON.stringify(stockMap));}
      }
    }
  }catch(e){/* offline — localStorage fallback */}
  buildCategories();renderProducts();
  let total=0;
  products.forEach(function(p){if(p.active!==false)p.variants.forEach(function(v){if(v.active!==false)total++;});});
  const hbn=document.getElementById('heroBadgeNum');
  if(hbn)hbn.textContent=total;
}

async function pushOrderToSupabase(orderObj){
  try{
    await fetch(SB_URL+'/rest/v1/orders',{
      method:'POST',
      headers:Object.assign({},sbH(),{'Prefer':'return=minimal'}),
      body:JSON.stringify({id:orderObj.id,data:orderObj,status:'new'})
    });
  }catch(e){}
}
